<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h1 { color: #3B82F6; }
        .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin: 20px 0; }
        .icon-item { text-align: center; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .icon-item img { max-width: 100%; height: auto; }
        .icon-item p { margin: 10px 0 0; font-size: 14px; color: #666; }
        button { background: #3B82F6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
        button:hover { background: #2563EB; }
        #output { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <h1>🎨 PWA Icon Generator</h1>
    <p>This tool generates all required PWA icon sizes from the SVG source.</p>
    
    <button onclick="generateIcons()">Generate All Icons</button>
    <button onclick="downloadAll()">Download All as ZIP</button>
    
    <div id="output"></div>
    <div class="icons" id="iconContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const svgSource = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="#3B82F6"/>
  <path d="M384 160H352V144C352 108.654 323.346 80 288 80H224C188.654 80 160 108.654 160 144V160H128C110.327 160 96 174.327 96 192V400C96 417.673 110.327 432 128 432H384C401.673 432 416 417.673 416 400V192C416 174.327 401.673 160 384 160ZM192 144C192 126.327 206.327 112 224 112H288C305.673 112 320 126.327 320 144V160H192V144ZM384 400H128V192H160V224C160 232.837 167.163 240 176 240C184.837 240 192 232.837 192 224V192H320V224C320 232.837 327.163 240 336 240C344.837 240 352 232.837 352 224V192H384V400Z" fill="white"/>
  <circle cx="384" cy="128" r="48" fill="#F59E0B"/>
  <text x="384" y="145" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>`;

        let generatedImages = {};

        function svgToImage(svgString, size) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, size, size);
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/png');
                };
                
                const blob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                img.src = url;
            });
        }

        async function generateIcons() {
            const container = document.getElementById('iconContainer');
            const output = document.getElementById('output');
            container.innerHTML = '';
            output.style.display = 'block';
            output.innerHTML = '<p>Generating icons...</p>';
            
            for (const size of sizes) {
                const blob = await svgToImage(svgSource, size);
                generatedImages[size] = blob;
                
                const url = URL.createObjectURL(blob);
                const div = document.createElement('div');
                div.className = 'icon-item';
                div.innerHTML = `
                    <img src="${url}" alt="${size}x${size}">
                    <p>${size}x${size}</p>
                    <a href="${url}" download="icon-${size}x${size}.png" style="color: #3B82F6; text-decoration: none; font-size: 12px;">Download</a>
                `;
                container.appendChild(div);
            }
            
            output.innerHTML = '<p>✅ All icons generated successfully! You can download them individually or all at once.</p>';
        }

        async function downloadAll() {
            if (Object.keys(generatedImages).length === 0) {
                alert('Please generate icons first!');
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder('pwa-icons');

            for (const [size, blob] of Object.entries(generatedImages)) {
                folder.file(`icon-${size}x${size}.png`, blob);
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pwa-icons.zip';
            a.click();
        }

        // Auto-generate on load
        window.addEventListener('load', generateIcons);
    </script>
</body>
</html>
